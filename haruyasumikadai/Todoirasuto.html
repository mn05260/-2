<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ToDoアプリ</title>
<style>
body { font-family: sans-serif; padding: 40px; background-color: #e3f2fd; text-align: center; }
.container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; min-width: 400px; }
/* 進捗バーのスタイル */
#progress-wrapper { margin-bottom: 20px; }
#progress-container { width: 100%; background: #e0e0e0; border-radius: 10px; height: 20px; overflow: hidden; margin: 5px 0; }
#progress-bar { height: 100%; width: 0%; background: #4caf50; transition: width 0.5s ease; }
/* 色見本 */
.legend { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; font-size: 11px; }
.legend-item { padding: 3px 8px; border-radius: 4px; border: 1px solid #ddd; }
#todo-list { list-style: none; padding: 0; text-align: left; }
.task-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; border-radius: 5px; margin-bottom: 5px; }
button { cursor: pointer; background: #2196f3; color: white; border: none; padding: 5px 10px; border-radius: 5px; margin: 2px; }
.del-btn { background: #ff5252; margin-left: 10px; }
#filters { margin-bottom: 15px; border-bottom: 2px solid #e3f2fd; padding-bottom: 10px; }
</style>
</head>
<body>

<div class="container">
    <h1>🖋️大学課題リスト📚</h1>

    <div id="progress-wrapper">
        <div>進捗率: <span id="progress-text">0</span>% (<span id="completed-count">0</span> / <span id="total-count">0</span>)</div>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <button onclick="resetProgress()" style="background:#9e9e9e; font-size: 10px; margin-top:5px;">進捗リセット</button>
    </div>

    <div class="legend">
        <span class="legend-item" style="background:#ffcdd2;">当日（緊急）</span>
        <span class="legend-item" style="background:#fff9c4;">1日前</span>
        <span class="legend-item" style="background:#c8e6c9;">余裕あり</span>
    </div>

    <div id="filters"></div>
    <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:20px;">
        <input type="text" id="classInput" placeholder="授業名 (例: 数学I)">
        <input type="text" id="taskInput" placeholder="課題名を入力">
        <input type="datetime-local" id="deadlineInput">
        <button onclick="addTask()">追加</button>
    </div>
    <ul id="todo-list"></ul>
</div>

<script>
function updateProgress(currentTasks) {
    const completed = parseInt(localStorage.getItem('completedTasks') || '0');
    const total = currentTasks.length + completed;
    const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
    document.getElementById('progress-bar').style.width = percent + "%";
    document.getElementById('progress-text').innerText = percent;
    document.getElementById('completed-count').innerText = completed;
    document.getElementById('total-count').innerText = total;
}

function resetProgress() { localStorage.setItem('completedTasks', '0'); loadTasks(); }

async function loadTasks() {
    const list = document.getElementById('todo-list');
    const filterArea = document.getElementById("filters");
    list.innerHTML = "";
    try {
        const res = await fetch('http://localhost:8080/list');
        const text = await res.text();
        const tasks = text.trim() ? text.split('\n').filter(t => t.trim() !== "") : [];
        updateProgress(tasks);
        tasks.sort((a,b) => {
            const dateA = a.match(/締切: ([^)]+)/) ? new Date(a.match(/締切: ([^)]+)/)[1]) : new Date(9999,11,31);
            const dateB = b.match(/締切: ([^)]+)/) ? new Date(b.match(/締切: ([^)]+)/)[1]) : new Date(9999,11,31);
            return dateA - dateB;
        });
        const classes = new Set();
        tasks.forEach(task => { addTaskToDisplay(task); classes.add(task.split("|")[0]); });
        filterArea.innerHTML = `<button onclick="filterClass('all')">全部</button> <button onclick="filterClass('today')" style="background:#ff9800;">🔥当日締切</button>`;
        classes.forEach(c => { filterArea.innerHTML += `<button onclick="filterClass('${c}')">${c}</button>`; });
    } catch(e) { console.error("Error:", e); }
}

function addTaskToDisplay(taskText) {
    const list = document.getElementById('todo-list');
    const li = document.createElement('li');
    li.className = 'task-item';
    
    // スタイルの基本設定
    li.style.borderLeft = "8px solid #ccc";
    li.style.backgroundColor = "#fafafa";
    li.style.padding = "15px";
    li.style.marginBottom = "10px";
    li.style.display = "flex";
    li.style.justifyContent = "space-between";
    li.style.alignItems = "center";
    li.style.borderBottom = "1px solid #eee";

    const parts = taskText.split("|");
    const className = parts[0];
    const taskContent = parts.slice(1).join("|");
    li.dataset.class = className;

    const match = taskText.match(/締切: ([^)]+)/);
    let remainingText = "";

    if (match) {
        const deadline = new Date(match[1]);
        const now = new Date();
        const diff = deadline - now;
        const oneDay = 24 * 60 * 60 * 1000;

        const days = Math.floor(diff / oneDay);
        const hours = Math.floor((diff % oneDay) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

        // 色と残り時間のロジック
        if (diff < 0) {
            // 期限切れ：赤
            li.style.borderLeftColor = "#f44336";
            li.style.backgroundColor = "#fff5f5";
            remainingText = " ⚠️期限切れ";
        } else if (diff <= oneDay) {
            // 当日（緊急）：赤
            li.style.borderLeftColor = "#f44336";
            li.style.backgroundColor = "#fff5f5";
            remainingText = ` 🚨残り ${hours}時間 ${minutes}分`;
        } else if (diff <= oneDay * 2) {
            // 1日前：黄色
            li.style.borderLeftColor = "#ffeb3b";
            li.style.backgroundColor = "#fffef0";
            remainingText = ` ⏳残り ${days}日 ${hours}時間 ${minutes}分`;
        } else {
            // それ以上：緑
            li.style.borderLeftColor = "#4caf50";
            li.style.backgroundColor = "#f0fff4";
            remainingText = ` ⏳残り ${days}日 ${hours}時間 ${minutes}分`;
        }
        li.dataset.isToday = (diff >= 0 && diff <= oneDay);
    }
    
    li.innerHTML = `<span>📘 <strong>${className}</strong> | ${taskContent}<br><small>${remainingText}</small></span><button class="del-btn" onclick="deleteTask('${taskText.replace(/'/g,"\\'")}')">完了</button>`;
    list.appendChild(li);
}

async function deleteTask(taskText) {
    let completed = parseInt(localStorage.getItem('completedTasks') || '0');
    localStorage.setItem('completedTasks', completed + 1);
    await fetch('http://localhost:8080/delete', { method: 'POST', body: taskText });
    loadTasks();
}

async function addTask() {
    const classInput = document.getElementById('classInput');
    const input = document.getElementById('taskInput');
    const deadline = document.getElementById('deadlineInput');
    if(input.value === "" || classInput.value === "") return;
    let taskData = `${classInput.value}|${input.value}`;
    if(deadline.value) taskData += ` (締切: ${deadline.value.replace('T',' ')})`;
    await fetch('http://localhost:8080/add', { method: 'POST', body: taskData });
    input.value = ''; deadline.value = ''; classInput.value = '';
    loadTasks();
}

function filterClass(className) {
    document.querySelectorAll(".task-item").forEach(task => {
        if(className === "all") task.style.display = "flex";
        else if(className === "today") task.style.display = (task.dataset.isToday === "true") ? "flex" : "none";
        else task.style.display = (task.dataset.class === className) ? "flex" : "none";
    });
}
window.onload = loadTasks;
</script>
</body>
</html>
