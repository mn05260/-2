<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大学課題管理アプリ</title>
<style>
/* ★変更：パディングを少し調整 */
body { font-family: sans-serif; padding: 20px 10px; background-color: #e3f2fd; text-align: center; }

/* ★変更：固定幅を解除し、レスポンシブに */
.container { 
    background: white; 
    padding: 20px; 
    border-radius: 15px; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    display: inline-block; 
    width: 100%;
    max-width: 500px; /* PCではこの幅で止まる */
    box-sizing: border-box; /* パディングを含めた幅計算 */
}

#progress-wrapper { margin-bottom: 20px; }
#progress-container { width: 100%; background: #e0e0e0; border-radius: 10px; height: 20px; overflow: hidden; margin: 5px 0; }
#progress-bar { height: 100%; width: 0%; background: #4caf50; transition: width 0.5s ease; }
.legend { display: flex; justify-content: center; gap: 5px; margin-bottom: 15px; font-size: 10px; flex-wrap: wrap; }
.legend-item { padding: 3px 6px; border-radius: 4px; border: 1px solid #ddd; }

#todo-list { list-style: none; padding: 0; text-align: left; }
.task-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; border-radius: 5px; margin-bottom: 5px; font-size: 14px; }
button { cursor: pointer; background: #2196f3; color: white; border: none; padding: 8px 12px; border-radius: 5px; margin: 2px; }
.del-btn { background: #ff5252; margin-left: 10px; flex-shrink: 0; }

/* ★変更：フィルタボタンもスマホで並びやすく */
#filters { margin-bottom: 15px; border-bottom: 2px solid #e3f2fd; padding-bottom: 10px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }

.screen { display: none; }
.active { display: block; }

/* 時間割テーブルのスタイル */
/* ★変更：スマホでテーブルがはみ出さないよう横スクロールを許可するクラスを追加 */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }

.timetable { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 400px; } /* ★min-widthでマスの形を維持 */
.timetable th, .timetable td { border: 1px solid #ddd; padding: 5px; height: 50px; font-size: 11px; }
.timetable th { background: #2196f3; color: white; height: 30px; }
.time-btn { width: 100%; height: 100%; background: #f8f9fa; color: #999; border: 1px dashed #ccc; cursor: pointer; border-radius: 3px; font-size: 10px; }
.time-btn.set { background: #e3f2fd; color: #1976d2; border: 1px solid #2196f3; font-weight: bold; }

/* 授業選択クイックボタンのスタイル */
#quick-class-buttons { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 10px; padding: 10px; background: #f0f7ff; border-radius: 10px; }
.quick-btn { background: #fff; color: #2196f3; border: 1px solid #2196f3; font-size: 12px; padding: 5px 10px; }
.quick-btn:hover { background: #2196f3; color: white; }

/* ★追加：入力フォームをスマホで押しやすく */
input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; width: 100%; box-sizing: border-box; }
@media (min-width: 600px) {
        body { font-size: 16px; }
        .container { max-width: 600px; padding: 30px; }
        h1 { font-size: 24px; }
        .task-item { font-size: 16px; padding: 15px; }
        .timetable th, .timetable td { height: 60px; font-size: 14px; }
        input, button { font-size: 16px !important; }
    }
</style>
</head>
<body>

<div class="container">
    <div id="home-screen" class="screen active">
        <h1>🖋️大学課題リスト📚</h1>
        <button onclick="showScreen('settings-screen')" style="background:#555; width: 100%; padding: 12px; margin-bottom: 20px; font-size: 14px;">📅 時間割を確認・設定する</button>

        <div id="progress-wrapper">
            <div style="font-size: 14px;">進捗率: <span id="progress-text">0</span>% (<span id="completed-count">0</span> / <span id="total-count">0</span>)</div>
            <div id="progress-container"><div id="progress-bar"></div></div>
            <button onclick="resetProgress()" style="background:#9e9e9e; font-size: 10px; margin-top:5px;">進捗リセット</button>
        </div>

        <div class="legend">
            <span class="legend-item" style="background:#ffcdd2;">当日</span>
            <span class="legend-item" style="background:#fff9c4;">1日前</span>
            <span class="legend-item" style="background:#c8e6c9;">余裕</span>
        </div>

        <div id="filters"></div>
        
        <div style="background:#f9f9f9; padding:15px; border-radius:10px; margin-bottom:20px; border:1px solid #eee;">
            <p style="font-size: 12px; margin-top:0; color:#666; text-align: left;">授業をえらぶ：</p>
            <div id="quick-class-buttons"></div>
            <div style="display:flex;flex-direction:column;gap:8px;">
                <input type="text" id="classInput" placeholder="授業名">
                <input type="text" id="taskInput" placeholder="課題名を入力">
                <input type="datetime-local" id="deadlineInput">
                <button onclick="addTask()" style="padding:12px; font-weight:bold; font-size: 16px;">課題を追加する</button>
            </div>
        </div>
        
        <ul id="todo-list"></ul>
    </div>

    <div id="settings-screen" class="screen">
        <button onclick="showScreen('home-screen')" style="float: left; background: #9e9e9e;">⬅ 戻る</button>
        <h2 style="margin-top: 50px;">📅 時間割設定</h2>
        <p style="font-size: 12px; color: #666;">マス目を押して授業名を登録</p>
        
        <div class="table-scroll">
            <table class="timetable">
                <thead>
                    <tr><th style="width:35px;"></th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th></tr>
                </thead>
                <tbody id="timetable-body"></tbody>
            </table>
        </div>
        
        <button onclick="clearTimetable()" style="background:#ff5252; margin-top: 10px; width: 100%; padding: 10px;">時間割をリセット</button>
    </div>
</div>

<script>

// --- 時間割システム ---
function getTimetableData() {
    return JSON.parse(localStorage.getItem('timetableData') || '{}');
}

function generateTimetable() {
    const tbody = document.getElementById('timetable-body');
    const data = getTimetableData();
    let html = "";
    for (let i = 1; i <= 6; i++) {
        html += `<tr><td style="background:#f0f0f0; font-weight:bold;">${i}</td>`;
        for (let j = 1; j <= 5; j++) {
            const id = `${i}-${j}`;
            const subjectName = data[id] || "+";
            const btnClass = data[id] ? "time-btn set" : "time-btn";
            html += `<td><button class="${btnClass}" onclick="setSubject('${id}')">${subjectName}</button></td>`;
        }
        html += `</tr>`;
    }
    tbody.innerHTML = html;
    updateQuickButtons();
}

function updateQuickButtons() {
    const btnArea = document.getElementById('quick-class-buttons');
    const data = getTimetableData();
    const subjects = [...new Set(Object.values(data))];
    
    if (subjects.length === 0) {
        btnArea.innerHTML = "<small style='color:#ccc;'>時間割を先に設定してください</small>";
        return;
    }

    btnArea.innerHTML = "";
    subjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = "quick-btn";
        btn.innerText = sub;
        btn.onclick = () => { document.getElementById('classInput').value = sub; };
        btnArea.appendChild(btn);
    });
}

function setSubject(id) {
    const currentData = getTimetableData();
    const name = prompt("授業名を入力", currentData[id] || "");
    if (name !== null) {
        if (name === "") delete currentData[id];
        else currentData[id] = name;
        localStorage.setItem('timetableData', JSON.stringify(currentData));
        generateTimetable();
    }
}

function clearTimetable() {
    if(confirm("全消去しますか？")) {
        localStorage.removeItem('timetableData');
        generateTimetable();
    }
}

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function updateProgress(currentTasks) {
    const completed = parseInt(localStorage.getItem('completedTasks') || '0');
    const total = currentTasks.length + completed;
   //完了した課題の数をブラウザでカウントして、棒グラフを動かす。
    const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
    document.getElementById('progress-bar').style.width = percent + "%";
    document.getElementById('progress-text').innerText = percent;
    document.getElementById('completed-count').innerText = completed;
    document.getElementById('total-count').innerText = total;
}

function resetProgress() { localStorage.setItem('completedTasks', '0'); loadTasks(); }

async function loadTasks() {
    const list = document.getElementById('todo-list');
    const filterArea = document.getElementById("filters");
    list.innerHTML = "";
    try {
        const res = await fetch('http://localhost:8080/list');
        const text = await res.text();
        const tasks = text.trim() ? text.split('\n').filter(t => t.trim() !== "") : [];
        updateProgress(tasks);
        
        tasks.sort((a,b) => {
            const dateA = a.match(/締切: ([^)]+)/) ? new Date(a.match(/締切: ([^)]+)/)[1]) : new Date(9999,11,31);
            const dateB = b.match(/締切: ([^)]+)/) ? new Date(b.match(/締切: ([^)]+)/)[1]) : new Date(9999,11,31);
            return dateA - dateB;
        });

        const classes = new Set();
        tasks.forEach(task => { 
            addTaskToDisplay(task); 
            classes.add(task.split("|")[0]); 
        });

        filterArea.innerHTML = `<button onclick="filterClass('all')">全部</button> <button onclick="filterClass('today')" style="background:#ff9800;">当日</button>`;
        classes.forEach(c => { filterArea.innerHTML += `<button onclick="filterClass('${c}')">${c}</button>`; });
    } catch(e) { console.error("Error:", e); }
}

function addTaskToDisplay(taskText) {
    const list = document.getElementById('todo-list');
    const li = document.createElement('li');
    li.className = 'task-item';
    const parts = taskText.split("|");
    const className = parts[0];
    const taskContent = parts.slice(1).join("|");
    li.dataset.class = className;

    const match = taskText.match(/締切: ([^)]+)/);
    let remainingText = "";
    li.style.borderLeft = "8px solid #ccc";

    if (match) {
        const deadline = new Date(match[1]);
        const now = new Date();
        const diff = deadline - now;
        const oneDay = 24 * 60 * 60 * 1000;
        //JavaScriptが現在時刻と締め切りを計算して期限が近いものは赤色、余裕があるものは緑色にする
        if (diff < 0) { li.style.borderLeftColor = "#f44336"; remainingText = " ⚠️期限切れ"; }
        else if (diff <= oneDay) { li.style.borderLeftColor = "#f44336"; remainingText = ` 🚨残り僅か`; }
        else { li.style.borderLeftColor = "#4caf50"; remainingText = ` ⏳余裕あり`; }
        li.dataset.isToday = (diff >= 0 && diff <= oneDay);
    }
    
    li.innerHTML = `<div style="overflow: hidden; text-overflow: ellipsis;">📘 <strong>${className}</strong><br>${taskContent}<br><small>${remainingText}</small></div><button class="del-btn" onclick="deleteTask('${taskText.replace(/'/g,"\\'")}')">完了</button>`;
    list.appendChild(li);
}

async function deleteTask(taskText) {
    let completed = parseInt(localStorage.getItem('completedTasks') || '0');
    localStorage.setItem('completedTasks', completed + 1);
    await fetch('http://localhost:8080/delete', { method: 'POST', body: taskText });
    loadTasks();
}

//課題追加の処理や時間割のフィルタリングをjavaに送る
async function addTask() {
    const classInput = document.getElementById('classInput');
    const input = document.getElementById('taskInput');
    const deadline = document.getElementById('deadlineInput');
    if(input.value === "" || classInput.value === "") return;
    let taskData = `${classInput.value}|${input.value}`;
    if(deadline.value) taskData += ` (締切: ${deadline.value.replace('T',' ')})`;
    await fetch('http://localhost:8080/add', { method: 'POST', body: taskData });
    input.value = ''; deadline.value = ''; classInput.value = '';
    loadTasks();
}

function filterClass(className) {
    document.querySelectorAll(".task-item").forEach(task => {
        if(className === "all") task.style.display = "flex";
        else if(className === "today") task.style.display = (task.dataset.isToday === "true") ? "flex" : "none";
        else task.style.display = (task.dataset.class === className) ? "flex" : "none";
    });
}

window.onload = function() {
    loadTasks();
    generateTimetable();
    updateQuickButtons();
};
</script>
</body>
</html>
